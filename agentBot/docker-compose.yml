services:
  agent-bot:
    build: .
    image: agent-bot:latest
    container_name: agent-bot
    restart: always
    ports:
      - "8082:8081"
      - "8083:8083"
    env_file:
      - .env
    environment:
      - ADMIN_PORT=8081
      - MCP_PORT=8083
    volumes:
      # 配置持久化：配置页修改的 bot.json / 黑名单保存在宿主机
      - ./config:/app/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
