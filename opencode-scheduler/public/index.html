<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>opencode 定时任务管理</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #e6e9ef;
    --muted: #8b93a5; --accent: #4f8ef7; --ok: #34c77b; --err: #f0564f; --warn: #f0a44f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.danger { background: transparent; border: 1px solid var(--err); color: var(--err); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; background: #1b1f29; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .badge.active { background: rgba(52,199,123,.15); color: var(--ok); }
  .badge.paused { background: rgba(240,164,79,.15); color: var(--warn); }
  .badge.completed { background: rgba(139,147,165,.15); color: var(--muted); }
  .badge.bash { background: rgba(79,142,247,.15); color: var(--accent); }
  .badge.ai { background: rgba(171,107,246,.2); color: #b98af7; }
  .status-success { color: var(--ok); } .status-failed, .status-timeout, .status-missed { color: var(--err); }
  .status-skipped { color: var(--warn); }
  .actions button { padding: 3px 9px; font-size: 12px; margin-right: 5px; }
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 16px; }
  .modal-mask.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 640px; max-width: 100%; padding: 22px; }
  .modal h2 { font-size: 16px; margin-bottom: 16px; }
  .form-row { display: flex; gap: 12px; }
  .form-row > div { flex: 1; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; background: #0f1115; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: inherit; }
  textarea { min-height: 80px; resize: vertical; }
  .cron-preview { font-size: 12px; color: var(--accent); margin-top: 4px; min-height: 18px; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; }
  .checkbox-row input { width: auto; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .history-panel { margin-top: 24px; }
  .history-panel h3 { font-size: 15px; margin-bottom: 10px; }
  pre.output { background: #0a0c10; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 12px; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .empty { color: var(--muted); text-align: center; padding: 30px; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 16px; display: none; z-index: 20; max-width: 420px; }
  .toast.error { border-left-color: var(--err); }
</style>
</head>
<body>
<h1>opencode 定时任务</h1>
<div class="sub" id="healthInfo">检查连接中…</div>

<div class="toolbar">
  <button onclick="openCreate()">+ 新建任务</button>
  <button class="ghost" onclick="loadJobs()">刷新</button>
  <button class="ghost" onclick="toggleHistory()">执行历史</button>
</div>

<table id="jobsTable">
  <thead><tr>
    <th>名称</th><th>类型</th><th>调度</th><th>状态</th><th>下次执行(北京时间)</th><th>操作</th>
  </tr></thead>
  <tbody></tbody>
</table>

<div class="history-panel" id="historyPanel" style="display:none">
  <h3>执行历史（最近 100 条）</h3>
  <table><thead><tr>
    <th>时间(本地)</th><th>任务</th><th>状态</th><th>耗时</th><th>输出 / 错误</th>
  </tr></thead><tbody id="historyBody"></tbody></table>
</div>

<!-- 新建/编辑弹窗 -->
<div class="modal-mask" id="editMask">
  <div class="modal">
    <h2 id="editTitle">新建任务</h2>
    <div class="form-row">
      <div><label>任务名称 *</label><input id="fName" placeholder="例如：每日巡检"></div>
      <div><label>类型 *</label>
        <select id="fType" onchange="onTypeChange()">
          <option value="bash">bash 执行命令</option>
          <option value="ai">AI prompt（opencode 执行）</option>
        </select></div>
    </div>
    <div class="form-row">
      <div><label>调度方式 *</label>
        <select id="fScheduleType" onchange="onScheduleChange()">
          <option value="cron">cron 循环</option>
          <option value="once">一次性定时</option>
        </select></div>
      <div id="cronField"><label>cron 表达式 *（分 时 日 月 周）</label>
        <input id="fCron" placeholder="0 9 * * 1-5" oninput="previewCron()">
        <div class="cron-preview" id="cronPreview"></div></div>
      <div id="onceField" style="display:none"><label>执行时间 *（ISO，如 2026-10-01T09:00:00+08:00）</label>
        <input id="fRunAt" placeholder="2026-10-01T09:00:00+08:00"></div>
    </div>
    <div id="bashField"><label>shell 命令 *</label>
      <textarea id="fCommand" placeholder="echo hello && df -h"></textarea></div>
    <div id="aiField" style="display:none"><label>AI prompt *</label>
      <textarea id="fPrompt" placeholder="检查 /workspace 下各项目 git status，汇总未提交变更…"></textarea>
      <label>模型覆盖（可选，provider/model-id）</label><input id="fModel" placeholder="留空使用 opencode 默认"></div>
    <div class="form-row">
      <div><label>源 opencode 会话 ID（结果回传，可选）</label><input id="fSessionId" placeholder="sess_xxx"></div>
      <div><label>工作目录（bash，可选）</label><input id="fWorkdir" placeholder="/workspace"></div>
    </div>
    <div class="form-row">
      <div><label>超时毫秒（可选）</label><input id="fTimeoutMs" type="number" placeholder="bash 300000 / ai 600000"></div>
      <div><label>失败重试次数</label><input id="fMaxRetries" type="number" value="1"></div>
    </div>
    <div class="form-row">
      <div><label>飞书 webhook（可选）</label><input id="fFeishu" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/xxx"></div>
      <div style="align-self:flex-end"><div class="checkbox-row">
        <input id="fNotifyOnSuccess" type="checkbox"><label style="margin:0" for="fNotifyOnSuccess">成功时也发送通知</label>
      </div></div>
    </div>
    <div class="modal-footer">
      <button class="ghost" onclick="closeEdit()">取消</button>
      <button onclick="saveJob()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let editingId = null;

function toast(msg, isError) {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  clearTimeout(t._timer); t._timer = setTimeout(() => t.style.display = 'none', 4000);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error(body?.error ?? res.status);
  return body;
}

async function loadHealth() {
  try {
    const h = await api('/api/health');
    $('healthInfo').textContent = `opencode: ${h.opencode === 'connected' ? '已连接 ✓' : '未连接 ✗（结果回传将失败）'}`;
  } catch { $('healthInfo').textContent = '服务异常'; }
}

async function loadJobs() {
  const jobs = await api('/api/jobs');
  const tbody = $('jobsTable').querySelector('tbody');
  tbody.innerHTML = jobs.length ? '' : '<tr><td colspan="6" class="empty">暂无任务，点击「新建任务」创建</td></tr>';
  for (const j of jobs) {
    const tr = document.createElement('tr');
    const schedule = j.scheduleType === 'cron'
      ? `<span class="mono">${j.cronExpr}</span>`
      : `一次性<br><span class="mono muted">${j.runAtLocal ?? j.runAt ?? ''}</span>`;
    tr.innerHTML = `
      <td><b>${esc(j.name)}</b><br><span class="muted mono" style="font-size:11px">${j.id}${j.running ? ' · 执行中' : ''}${j.instanceName ? ` · ${esc(j.instanceName)}` : ''}</span></td>
      <td><span class="badge ${j.type}">${j.type}</span></td>
      <td>${schedule}</td>
      <td><span class="badge ${j.status}">${j.status}</span></td>
      <td class="mono" style="font-size:12px">${j.nextRunAtLocal ?? j.nextRunAt ?? '—'}</td>
      <td class="actions">
        <button class="ghost" onclick="runJob('${j.id}')">执行</button>
        ${j.status === 'active'
          ? `<button class="ghost" onclick="jobAction('${j.id}','pause')">暂停</button>`
          : j.status === 'paused' ? `<button class="ghost" onclick="jobAction('${j.id}','resume')">恢复</button>` : ''}
        <button class="ghost" onclick="openEdit('${j.id}')">编辑</button>
        <button class="danger" onclick="deleteJob('${j.id}')">删除</button>
      </td>`;
    tbody.appendChild(tr);
  }
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// UTC ISO 时间 → 浏览器本地时区可读格式（执行历史展示用）
function fmtLocalTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

async function runJob(id) {
  try { const r = await api(`/api/jobs/${id}/run`, { method: 'POST' });
    if (r.status === 'skipped') toast('上一轮任务仍在执行中，本次触发已跳过（可稍后再试或查看执行历史）', true);
    else toast(`执行完成: ${r.status}${r.durationMs ? `，耗时 ${(r.durationMs/1000).toFixed(1)}s` : ''}${r.output ? '\n' + r.output.slice(0, 300) : ''}`, r.status !== 'success');
    loadJobs(); if (!$('historyPanel').style.display.includes('none')) loadHistory();
  } catch (e) { toast('执行失败: ' + e.message, true); }
}
async function jobAction(id, act) { await api(`/api/jobs/${id}/${act}`, { method: 'POST' }); loadJobs(); }
async function deleteJob(id) {
  if (!confirm('确认删除该任务及其执行历史？')) return;
  await api(`/api/jobs/${id}`, { method: 'DELETE' }); loadJobs();
}

async function previewCron() {
  const expr = $('fCron').value.trim();
  if (!expr) { $('cronPreview').textContent = ''; return; }
    try {
    const r = await fetch('/api/cron/preview?expr=' + encodeURIComponent(expr));
    const b = await r.json();
    $('cronPreview').textContent = r.ok
      ? '接下来: ' + b.next.join(' | ')
      : '✗ ' + b.error;
  } catch { $('cronPreview').textContent = ''; }
}

function onTypeChange() {
  $('bashField').style.display = $('fType').value === 'bash' ? '' : 'none';
  $('aiField').style.display = $('fType').value === 'ai' ? '' : 'none';
}
function onScheduleChange() {
  $('cronField').style.display = $('fScheduleType').value === 'cron' ? '' : 'none';
  $('onceField').style.display = $('fScheduleType').value === 'once' ? '' : 'none';
}

function openCreate() {
  editingId = null;
  $('editTitle').textContent = '新建任务';
  for (const id of ['fName','fCron','fRunAt','fCommand','fPrompt','fModel','fSessionId','fWorkdir','fTimeoutMs','fFeishu']) $(id).value = '';
  $('fMaxRetries').value = 1; $('fNotifyOnSuccess').checked = false;
  $('fType').value = 'bash'; $('fScheduleType').value = 'cron';
  onTypeChange(); onScheduleChange(); $('cronPreview').textContent = '';
  $('editMask').classList.add('open');
}

async function openEdit(id) {
  const j = (await api('/api/jobs')).find(x => x.id === id);
  if (!j) return;
  editingId = id;
  $('editTitle').textContent = '编辑任务: ' + j.name;
  $('fName').value = j.name; $('fType').value = j.type; $('fScheduleType').value = j.scheduleType;
  $('fCron').value = j.cronExpr ?? ''; $('fRunAt').value = j.runAt ?? '';
  $('fCommand').value = j.command ?? ''; $('fPrompt').value = j.prompt ?? '';
  $('fModel').value = j.model ?? ''; $('fSessionId').value = j.sessionId ?? '';
  $('fWorkdir').value = j.workdir ?? ''; $('fTimeoutMs').value = j.timeoutMs ?? '';
  $('fMaxRetries').value = j.maxRetries ?? 1; $('fFeishu').value = j.feishuWebhook ?? '';
  $('fNotifyOnSuccess').checked = j.notifyOnSuccess;
  onTypeChange(); onScheduleChange(); previewCron();
  $('editMask').classList.add('open');
}
function closeEdit() { $('editMask').classList.remove('open'); }

async function saveJob() {
  const payload = {
    name: $('fName').value.trim(), type: $('fType').value, scheduleType: $('fScheduleType').value,
    cronExpr: $('fCron').value.trim() || null, runAt: $('fRunAt').value.trim() || null,
    command: $('fCommand').value.trim() || null, prompt: $('fPrompt').value.trim() || null,
    model: $('fModel').value.trim() || null, sessionId: $('fSessionId').value.trim() || null,
    workdir: $('fWorkdir').value.trim() || null,
    timeoutMs: $('fTimeoutMs').value ? Number($('fTimeoutMs').value) : null,
    maxRetries: Number($('fMaxRetries').value) || 1,
    feishuWebhook: $('fFeishu').value.trim() || null,
    notifyOnSuccess: $('fNotifyOnSuccess').checked,
  };
  try {
    if (editingId) await api(`/api/jobs/${editingId}`, { method: 'PUT', headers: {'content-type':'application/json'}, body: JSON.stringify(payload) });
    else await api('/api/jobs', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify(payload) });
    closeEdit(); toast('已保存'); loadJobs();
  } catch (e) { toast('保存失败: ' + e.message, true); }
}

async function loadHistory() {
  const list = await api('/api/executions');
  $('historyBody').innerHTML = list.length ? '' : '<tr><td colspan="5" class="empty">暂无执行记录</td></tr>';
  for (const e of list) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="mono" style="font-size:12px;white-space:nowrap">${fmtLocalTime(e.started_at)}</td>
      <td>${esc(e.job_name ?? '')}<br><span class="muted mono" style="font-size:11px">${e.job_id}</span></td>
      <td class="status-${e.status}">${e.status}</td>
      <td>${e.duration_ms != null ? (e.duration_ms/1000).toFixed(1)+'s' : '—'}</td>
      <td style="max-width:420px">${e.error ? `<span class="status-failed">${esc(e.error).slice(0,200)}</span>` :
        (e.output_summary ? `<pre class="output">${esc(e.output_summary.slice(0,600))}</pre>` : '<span class="muted">—</span>')}</td>`;
    $('historyBody').appendChild(tr);
  }
}
function toggleHistory() {
  const p = $('historyPanel');
  p.style.display = p.style.display === 'none' ? '' : 'none';
  if (p.style.display !== 'none') loadHistory();
}

loadHealth(); loadJobs(); setInterval(loadJobs, 15000);
</script>
</body>
</html>
